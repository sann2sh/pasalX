name: pasalx_mobile
description: "PasalX — Mobile POS, Inventory, and Accounts Suite"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.14.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

  # Local Persistence & SQLCipher AES-256 Encryption
  drift: ^2.35.4
  sqlite3: ^3.0.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Cryptography (AES-256-GCM Envelope & Keystore Sealing)
  cryptography: ^2.7.0

  # Navigation & Routing
  go_router: ^14.8.1

  # Barcode & Scanning
  mobile_scanner: ^6.0.7

  # Connectivity & Hardware Keystore Storage
  connectivity_plus: ^6.1.3
  flutter_secure_storage: ^9.2.4

  # Networking & Utilities
  http: ^1.3.0
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
