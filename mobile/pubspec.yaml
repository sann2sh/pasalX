name: pasalx_mobile
description: "PasalX — Mobile POS, Inventory, and Accounts Suite"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.14.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local Persistence & SQLCipher AES-256 Encryption
  drift: ^2.24.2
  sqlite3: ^2.5.0
  sqlite3_flutter_libs: ^0.5.28
  sqlcipher_flutter_libs: ^0.6.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Navigation & Routing
  go_router: ^14.8.1

  # Barcode & Scanning
  mobile_scanner: ^6.0.7

  # Connectivity & Hardware Keystore Storage
  connectivity_plus: ^6.1.3
  flutter_secure_storage: ^9.2.4

  # Networking & Utilities
  http: ^1.3.0
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.15
  drift_dev: ^2.24.2
  riverpod_generator: ^2.6.4

flutter:
  uses-material-design: true
