name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Go Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pasalx
          POSTGRES_PASSWORD: pasalx_dev_pass
          POSTGRES_DB: pasalx_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://pasalx:pasalx_dev_pass@localhost:5432/pasalx_db?sslmode=disable
      DATABASE_MIGRATE_URL: postgres://pasalx:pasalx_dev_pass@localhost:5432/pasalx_db?sslmode=disable
      PASALX_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run migrations
        run: go run ./cmd/pasalx-admin migrate up

      - name: Vet & Test
        run: |
          go vet ./...
          go test -count=1 -race ./...

      - name: Build binaries
        run: |
          go build ./cmd/api
          go build ./cmd/pasalx-admin

  mobile:
    name: Flutter Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub
